services:
  postgres:
    image: postgres:17
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: lab-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

  swagger:
    image: swaggerapi/swagger-ui
    container_name: lab-swagger
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./03-rest:/spec

volumes:
  pgdata: