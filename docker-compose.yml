services:
  postgres:
    image: postgres:17
    container_name: lab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
      POSTGRES_DB: lab
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: lab-adminer
    restart: unless-stopped
    ports:
      - "8081:8080"

  swagger:
    image: swaggerapi/swagger-ui
    container_name: lab-swagger
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
    volumes:
      - ./03-rest:/spec

  api:
    build: ./03-rest/service
    container_name: lab-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://lab:lab@postgres:5432/lab
      WEBHOOK_SECRET: lab-secret
    volumes:
      - ./03-rest/service:/app
    depends_on:
      - postgres

  kafka:
    image: apache/kafka:3.8.0
    container_name: lab-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: lab-kafka-cluster-0001
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: lab-kafka-ui
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  relay:
    build: ./04-async/relay
    container_name: lab-relay
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lab:lab@postgres:5432/lab
      KAFKA_BOOTSTRAP: kafka:29092
    depends_on:
      - postgres
      - kafka

  notifier:
    build: ./04-async/notifier
    container_name: lab-notifier
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://lab:lab@postgres:5432/lab
      KAFKA_BOOTSTRAP: kafka:29092
      FAIL_FIRST_ATTEMPTS: "0"
    depends_on:
      - postgres
      - kafka

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: lab-keycloak
    restart: unless-stopped
    command: start-dev
    ports:
      - "8084:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin

volumes:
  pgdata: